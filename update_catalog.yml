name: Actualizar Catálogo IPTV

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Ejecutar Script de Optimización
        run: python optimizer.py

      - name: Subir cambios a GitHub
        run: |
          git config --global user.name "dakomusical-bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add vod_catalog.json
          git commit -m "Auto-actualización de catálogo VOD" || exit 0
          git push